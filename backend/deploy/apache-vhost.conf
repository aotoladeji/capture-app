# Example Apache virtual host for the capture-app Laravel backend.
# This is a SEPARATE app/server from the id-card-unit management backend —
# give it its own port or subdomain (it's the "CAPTURE_APP_URL" the
# management app's .env points at).
#
# Place this in /etc/apache2/sites-available/id-card-capture-api.conf
# and enable with: a2ensite id-card-capture-api && systemctl reload apache2
#
# Requires: mod_rewrite, PHP 8.2+ with ext-imagick, ext-pdo_mysql.

<VirtualHost *:5001>
    ServerName capture-api.your-domain.example

    DocumentRoot /var/www/id-card-capture-platform/public

    <Directory /var/www/id-card-capture-platform/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # If using PHP-FPM instead of mod_php, uncomment and adjust the socket path:
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/id-card-capture-error.log
    CustomLog ${APACHE_LOG_DIR}/id-card-capture-access.log combined
</VirtualHost>

# Remember to also add a `Listen 5001` line in /etc/apache2/ports.conf
# (or pick a different port/subdomain and update CAPTURE_APP_URL in the
# management app's backend/.env to match).
